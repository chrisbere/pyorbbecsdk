name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]  # windows only
        python-version: [3.12]
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pybind11==2.11.0 pybind11-global==2.11.0 wheel

    - name: Download Orbbec SDK v2.4.8
      run: |
        curl -L -o sdk.zip https://github.com/orbbec/OrbbecSDK_v2/releases/download/v2.4.8/OrbbecSDK_Windows_x64_v2.4.8.zip
        mkdir sdk
        tar -xf sdk.zip -C sdk

    - name: Configure CMake
      run: |
        cmake -S . -B build `
              -DPYBIND11_PYTHON_VERSION=${{ matrix.python-version }} `
              -DOrbbecSDK_DIR="${{ github.workspace }}\\sdk"

    - name: Build
      run: cmake --build build --config Release

    - name: Build Python Wheel
      run: python setup.py bdist_wheel

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-wheel-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/*.whl
